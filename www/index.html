<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التقرير الأسبوعي – اوراسكوم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="html2canvas.min.js"></script>
<script>if(typeof html2canvas==="undefined"){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>')}</script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#d9dde3;--pr:#c8102e;--prtx:#fff;--in:#fafbfc;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1f2327;--tx:#eceff3;--mut:#9aa3ae;--bd:#343a41;--in:#171a1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1f2327;--tx:#eceff3;--mut:#9aa3ae;--bd:#343a41;--in:#171a1d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15px;padding-bottom:110px}
header{background:var(--pr);color:var(--prtx);padding:14px 16px}
header b{font-size:19px;display:block}header span{font-size:12px;opacity:.9}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px;color:var(--pr)}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px}
.rh{display:flex;gap:6px;margin-bottom:6px}
.rh input{font-weight:600}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.x{background:transparent;color:var(--mut);border:1px solid var(--bd);padding:0 12px}
.add{width:100%;background:transparent;color:var(--pr);border:1px dashed var(--pr)}
canvas#sg{width:100%;height:130px;border:1px solid var(--bd);border-radius:8px;background:#fff;touch-action:none;display:block}
.bar{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;max-width:100%}
.bar>button,.bar>.dd{flex:1}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;flex-direction:column;z-index:9;padding:env(safe-area-inset-top,0px) 10px 10px}
#ov.on{display:flex}
#ov .t{color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
#ov .im{flex:1;overflow:auto;text-align:center}
#ov img{max-width:100%;background:#fff}
#msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;display:none;z-index:10}
#stage{position:fixed;left:-12000px;top:0}
/* ورقة التقرير */
#sheet{width:794px;background:#fff;color:#000;padding:36px 44px 40px;direction:rtl;font-family:Cairo,Tahoma,Arial,sans-serif}
#sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
#sheet .lg{direction:ltr;text-align:left;line-height:1}
#sheet .lg b{font-size:40px;letter-spacing:1px;font-weight:700;color:#222;display:block}
#sheet .lg small{font-size:9px;letter-spacing:6px;color:#666}
#sheet .tt{text-align:center;font-weight:700;font-size:19px;text-decoration:underline;margin-top:6px}
#sheet .co{text-align:left;font-size:11px;margin:4px 0 0}
#sheet .inf{font-size:15px;line-height:2;margin:6px 0 8px}
#sheet h3{text-align:center;font-size:14px;margin:14px 0 5px;text-decoration:underline}
#sheet table{width:100%;border-collapse:collapse;font-size:13px}
#sheet th,#sheet td{border:1px solid #333;padding:4px 6px;text-align:center;min-height:24px}
#sheet th{background:#eee}
#sheet td.n{width:34px}
#sheet td.l{text-align:right}
#sheet .sg{margin-top:26px;font-size:14px;display:flex;gap:30px;align-items:flex-end}
#sheet .sg img{height:70px;max-width:260px}

button{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;transition:transform .08s,box-shadow .08s,filter .08s}
button.b3{--d:#8f0b20;background:linear-gradient(#e8344f,#c8102e);color:#fff;font-weight:600;margin-bottom:5px;box-shadow:0 5px 0 var(--d),0 8px 12px rgba(0,0,0,.28)}
button.b3.s{--d:#8d949e;background:linear-gradient(#f4f6f8,#d5d9df);color:#1b1f24}
button.b3.w{--d:#7a5200;background:linear-gradient(#f5b83a,#d9951a)}
button.b3.mi{flex:none;width:100%}
button.b3:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d),0 2px 4px rgba(0,0,0,.3);filter:brightness(.93)}
.add{box-shadow:0 3px 0 rgba(200,16,46,.45);margin-bottom:3px}.add:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0);background:rgba(200,16,46,.1)}
.x{box-shadow:0 3px 0 var(--bd)}.x:active{transform:translateY(3px);box-shadow:none}
.dd{position:relative;display:flex}
#menu{position:absolute;bottom:calc(100% + 10px);left:0;right:0;display:none;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 8px 3px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#menu.on{display:flex}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.35;transform:scale(0);animation:rp .5s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
#cf{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:11;padding:20px}
#cf.on{display:flex}
#cf .bx{background:var(--card);border-radius:14px;padding:18px;max-width:340px;width:100%}
#cf p{margin:0 0 16px}#cf .bt{display:flex;gap:10px}#cf .bt button{flex:1}
body{padding-bottom:125px}
#sheet .inf{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
#sheet .sg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end}
#sheet .sc{text-align:center}
button.b3.g{--d:#0b6b3a;background:linear-gradient(#35d870,#1fa855)}
</style>
</head>
<body>
<header><b>التقرير الأسبوعي</b><span>شركة اوراسكوم لإنشاء الطرق – إدارة الصحة والسلامة</span></header>
<main id="app"></main>
<div class="bar"><button class="b3 w" id="bN">جديد</button><button class="b3 g" id="bW">واتساب</button><button class="b3" id="bI">حفظ صورة</button></div>
<div id="ov"><div class="t"><span id="ovt"></span><button class="b3 s" id="ovx">إغلاق</button></div><div class="im"><img id="ovi" alt=""></div></div>
<div id="cf"><div class="bx"><p>مسح كل البيانات المكتوبة والبدء من جديد؟ لا يمكن التراجع.</p><div class="bt"><button class="b3 s" id="cfn">إلغاء</button><button class="b3" id="cfy">نعم، امسح</button></div></div></div>
<div id="msg"></div>
<div id="stage"><div id="sheet"></div></div>
<script>
var DEF=[
{k:'ppe',t:'أولا : مهمات الأفراد المطلوبة',h:['المهمات','العدد المطلوب','رصيد المخزون','ملاحظات'],rows:['خوذه','فست','حذاء','سداده أذن','نظاره','قفاز','وش لحام','أفرول','قمع فسفوري مرن']},
{k:'eq',t:'ثانيا : تجهيزات المعدات المطلوبة',h:['التجهيزات المطلوبة','العدد','رصيد المخزون','نوع المعدة','ملاحظات'],rows:['سرينة خلفية','فنار','طفايات','رخصه سائق المعدة']},
{k:'st',t:'ثالثا : تجهيزات الموقع المطلوبة',h:['الموقع','طفايات','حواجز','لافتات'],rows:['مكاتب','سكن','خلاطة','بنزينة','تحويلات']},
{k:'ot',t:'أخرى',h:['أخرى','نوع','عدد'],rows:['','']}
];
var S={project:'',force:'',sup:'',asst:'',date:new Date().toISOString().slice(0,10),name:'',sig:'',tb:{}};
try{var sv=localStorage.getItem('wr1');if(sv)S=Object.assign(S,JSON.parse(sv))}catch(e){}
DEF.forEach(function(d){if(!S.tb[d.k])S.tb[d.k]=d.rows.map(function(r){return{n:r,v:d.h.slice(1).map(function(){return''})}})});
function save(){try{localStorage.setItem('wr1',JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
var h='<div class="card"><h2>بيانات التقرير</h2><label>المشروع</label><input data-f="project" value="'+esc(S.project)+'" placeholder="اسم المشروع"><div style="height:8px"></div><label>قوة المشروع</label><input data-f="force" inputmode="numeric" value="'+esc(S.force)+'" placeholder="إجمالي عدد الأفراد"><div style="height:8px"></div><div class="g2"><div><label>عدد مشرفين السيفتي</label><input data-f="sup" inputmode="numeric" value="'+esc(S.sup)+'"></div><div><label>عدد مساعدين السيفتي</label><input data-f="asst" inputmode="numeric" value="'+esc(S.asst)+'"></div></div><div style="height:8px"></div><label>التاريخ</label><input type="date" data-f="date" value="'+S.date+'"></div>';
DEF.forEach(function(d){
h+='<div class="card"><h2>'+d.t+'</h2>';
S.tb[d.k].forEach(function(r,i){
h+='<div class="row"><div class="rh"><input data-t="'+d.k+'" data-r="'+i+'" data-c="n" value="'+esc(r.n)+'" placeholder="'+d.h[0]+'"><button class="x" data-del="'+d.k+':'+i+'" aria-label="حذف">×</button></div><div class="fl">';
d.h.slice(1).forEach(function(c,j){h+='<div><label>'+c+'</label><input data-t="'+d.k+'" data-r="'+i+'" data-c="'+j+'" value="'+esc(r.v[j]||'')+'"></div>'});
h+='</div></div>'});
h+='<button class="add" data-add="'+d.k+'">+ إضافة بند</button></div>'});
h+='<div class="card"><h2>الاسم والتوقيع</h2><label>الاسم</label><input data-f="name" value="'+esc(S.name)+'" placeholder="اسم المشرف"><div style="height:8px"></div><label>التوقيع (ارسم بإصبعك)</label><canvas id="sg" width="600" height="260"></canvas><div style="height:8px"></div><button class="x" id="sgc" style="padding:8px 14px">مسح التوقيع</button></div>';
document.getElementById('app').innerHTML=h;initSig()}
document.getElementById('app').addEventListener('input',function(e){
var t=e.target;if(t.dataset.f){S[t.dataset.f]=t.value}
else if(t.dataset.t){var r=S.tb[t.dataset.t][t.dataset.r];if(t.dataset.c==='n')r.n=t.value;else r.v[t.dataset.c]=t.value}
save()});
document.getElementById('app').addEventListener('click',function(e){
var b=e.target.closest('button');if(!b)return;
if(b.dataset.del){var p=b.dataset.del.split(':');S.tb[p[0]].splice(+p[1],1);save();render()}
else if(b.dataset.add){var d=DEF.filter(function(x){return x.k===b.dataset.add})[0];S.tb[d.k].push({n:'',v:d.h.slice(1).map(function(){return''})});save();render()}
else if(b.id==='sgc'){S.sig='';save();var c=document.getElementById('sg');c.getContext('2d').clearRect(0,0,c.width,c.height)}});
function initSig(){
var c=document.getElementById('sg'),x=c.getContext('2d'),dr=false;
x.lineWidth=4;x.lineCap='round';x.strokeStyle='#111';
if(S.sig){var im=new Image();im.onload=function(){x.drawImage(im,0,0,c.width,c.height)};im.src=S.sig}
function pt(e){var r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}
c.addEventListener('pointerdown',function(e){dr=true;c.setPointerCapture(e.pointerId);var p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1])});
c.addEventListener('pointermove',function(e){if(!dr)return;var p=pt(e);x.lineTo(p[0],p[1]);x.stroke()});
function up(){if(!dr)return;dr=false;S.sig=c.toDataURL('image/png');save()}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)}
function fmtDate(){var d=new Date(S.date+'T00:00:00');if(isNaN(d))return{d:'',w:''};
return{d:d.toLocaleDateString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit'}),w:d.toLocaleDateString('ar-EG',{weekday:'long'})}}
function sheet(){
var f=fmtDate(),h='<div class="hd"><div class="lg"><b>ORASCOM</b><small>ROAD CONSTRUCTION</small></div><div class="tt">تقرير أسبوعي</div><div style="width:150px"></div></div>';
h+='<div class="co">شركة اوراسكوم لإنشاء الطرق إدارة الصحة والسلامة</div>';
h+='<div class="inf"><div>اليوم : '+f.w+'</div><div>التاريخ : '+f.d+'</div><div>مشروع : '+esc(S.project)+'</div><div>قوة المشروع : '+esc(S.force)+'</div><div>عدد مشرفين السيفتي : '+esc(S.sup)+'</div><div>عدد مساعدين السيفتي : '+esc(S.asst)+'</div></div>';
DEF.forEach(function(d){
if(d.k!=='ot')h+='<h3>'+d.t+'</h3>';else h+='<div style="height:10px"></div>';
h+='<table><tr>'+(d.k==='ot'?'':'<th class="n">م</th>')+d.h.map(function(c){return'<th>'+c+'</th>'}).join('')+'</tr>';
S.tb[d.k].forEach(function(r,i){
h+='<tr>'+(d.k==='ot'?'':'<td class="n">'+(i+1).toLocaleString('ar-EG')+'</td>')+'<td class="l">'+esc(r.n)+'</td>'+r.v.map(function(v){return'<td>'+(v===''?'—':esc(v))+'</td>'}).join('')+'</tr>'});
h+='</table>'});
h+='<div class="sg"><div>الاسم : '+esc(S.name)+'</div><div class="sc">التوقيع :<br>'+(S.sig?'<img src="'+S.sig+'" alt="">':'')+'</div><div></div></div>';
return h}
function msg(t){var m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(function(){m.style.display='none'},2800)}
async function shot(){
if(typeof html2canvas==='undefined')throw new Error('lib');
var s=document.getElementById('sheet');s.innerHTML=sheet();
try{await document.fonts.ready}catch(e){}
return html2canvas(s,{scale:2,backgroundColor:'#ffffff',logging:false})}
function show(url,t){document.getElementById('ovi').src=url;document.getElementById('ovt').textContent=t;document.getElementById('ov').classList.add('on')}
document.getElementById('ovx').onclick=function(){document.getElementById('ov').classList.remove('on')};
function fname(ext){return'weekly-report-'+(S.date||'')+'.'+ext}

function b64(blob){return new Promise(function(r){var f=new FileReader();f.onload=function(){r(String(f.result).split(',')[1])};f.readAsDataURL(blob)})}
function isWV(){var C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform())||/; wv\)/.test(navigator.userAgent)}
async function saveBlob(blob,name,c,kind){
var C=window.Capacitor,P=C&&C.Plugins;
/* تطبيق Capacitor: كتابة الملف ثم فتح قائمة المشاركة/الحفظ الأصلية */
if(P&&P.Filesystem&&P.Share){
try{var w=await P.Filesystem.writeFile({path:name,data:await b64(blob),directory:'CACHE'});
await P.Share.share({title:name,url:w.uri,dialogTitle:'حفظ / مشاركة التقرير'});return}
catch(e){if(/cancel/i.test(String(e&&e.message||e)))return}}
/* متصفح عادي: تنزيل مباشر */
if(!isWV()){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);msg('تم الحفظ');return}
/* WebView بدون إضافات: عرض الصورة للحفظ اليدوي */
show(c.toDataURL('image/png'),'اضغط مطولاً على الصورة واختر حفظ')}
async function out(kind){
try{
msg('جاري التجهيز...');
var c=await shot(),blob,name;
if(kind==='png'){blob=await new Promise(function(r){c.toBlob(r,'image/png')});name=fname('png')}
else{
var J=window.jspdf.jsPDF,p=new J({unit:'mm',format:'a4',orientation:'portrait'});
var W=210,H=297,w=W,h=c.height*W/c.width;if(h>H){h=H;w=c.width*H/c.height}
p.addImage(c.toDataURL('image/jpeg',.92),'JPEG',(W-w)/2,0,w,h);
blob=p.output('blob');name=fname('pdf')}
await saveBlob(blob,name,c,kind);
}catch(e){msg('خطأ: '+(e&&e.message||e))}}
document.getElementById('bI').onclick=function(){out('png')};
async function shareWA(){try{msg('جاري التجهيز...');var c=await shot(),blob=await new Promise(function(r){c.toBlob(r,'image/png')}),name=fname('png'),P=window.Capacitor&&window.Capacitor.Plugins;
if(typeof saveBlob==='function'&&P&&P.Filesystem&&P.Share){await saveBlob(blob,name,c,'png');return}
var f=new File([blob],name,{type:'image/png'});
if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:'التقرير الأسبوعي'});return}
await out('png')}catch(e){if(!e||e.name!=='AbortError')msg('تعذرت المشاركة')}}
document.getElementById('bW').onclick=shareWA;
function reset(){S={project:'',force:'',sup:'',asst:'',date:new Date().toISOString().slice(0,10),name:'',sig:'',tb:{}};DEF.forEach(function(d){S.tb[d.k]=d.rows.map(function(r){return{n:r,v:d.h.slice(1).map(function(){return''})}})});save();render();window.scrollTo(0,0);msg('تم مسح البيانات')}
var cf=document.getElementById('cf');
document.getElementById('bN').onclick=function(){cf.classList.add('on')};
document.getElementById('cfn').onclick=function(){cf.classList.remove('on')};
document.getElementById('cfy').onclick=function(){cf.classList.remove('on');reset()};
document.addEventListener('pointerdown',function(e){var b=e.target.closest('button');if(!b)return;var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,p=document.createElement('span');p.className='rp';p.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';b.appendChild(p);setTimeout(function(){p.remove()},550);try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}});
render();
</script>
</body>
</html>
